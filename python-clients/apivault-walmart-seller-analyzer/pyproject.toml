[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apivault-walmart-seller-analyzer"
version = "0.1.0"
description = "Python client for Walmart Seller Analyzer on Apify. Run, resume and download results with diagnostics."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name="ApiVault Labs"}]
keywords = ["apify", "python-sdk", "walmart", "seller", "revenue", "product", "opportunity", "analyzer"]

[project.urls]
Homepage = "https://apify.com/apivault_labs/walmart-seller-revenue-product-opportunity-analyzer"
Source = "https://github.com/apivault-labs/apivault-labs/tree/main/python-clients/apivault-walmart-seller-analyzer"
Documentation = "https://github.com/apivault-labs/apivault-labs/tree/main/python-clients/apivault-walmart-seller-analyzer#readme"

[tool.setuptools.packages.find]
include = ["apivault_walmart_seller_analyzer*"]
