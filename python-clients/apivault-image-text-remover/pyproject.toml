[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apivault-image-text-remover"
version = "0.1.0"
description = "Python client for Image Text Remover on Apify. Run, resume and download results with diagnostics."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name="ApiVault Labs"}]
keywords = ["apify", "python-sdk", "image", "text", "remover"]

[project.urls]
Homepage = "https://apify.com/apivault_labs/image-text-remover"
Source = "https://github.com/apivault-labs/apivault-labs/tree/main/python-clients/apivault-image-text-remover"
Documentation = "https://github.com/apivault-labs/apivault-labs/tree/main/python-clients/apivault-image-text-remover#readme"

[tool.setuptools.packages.find]
include = ["apivault_image_text_remover*"]
