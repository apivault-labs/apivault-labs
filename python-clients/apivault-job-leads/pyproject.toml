[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apivault-job-leads"
version = "0.1.0"
description = "Python client for Job Leads Scraper on Apify. Run, resume and download results with diagnostics."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name="ApiVault Labs"}]
keywords = ["apify", "python-sdk", "job", "leads"]

[project.urls]
Homepage = "https://apify.com/apivault_labs/apify-actor-job-leads"
Source = "https://github.com/apivault-labs/apivault-labs/tree/main/python-clients/apivault-job-leads"
Documentation = "https://github.com/apivault-labs/apivault-labs/tree/main/python-clients/apivault-job-leads#readme"

[tool.setuptools.packages.find]
include = ["apivault_job_leads*"]
