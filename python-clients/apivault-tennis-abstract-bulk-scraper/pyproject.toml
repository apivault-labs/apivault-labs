[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apivault-tennis-abstract-bulk-scraper"
version = "0.1.0"
description = "Python client for Tennis Abstract Scraper on Apify. Run, resume and download results with diagnostics."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name="ApiVault Labs"}]
keywords = ["apify", "python-sdk", "tennis", "abstract", "bulk", "scraper"]

[project.urls]
Homepage = "https://apify.com/apivault_labs/tennis-abstract-bulk-scraper"
Source = "https://github.com/apivault-labs/apivault-labs/tree/main/python-clients/apivault-tennis-abstract-bulk-scraper"
Documentation = "https://github.com/apivault-labs/apivault-labs/tree/main/python-clients/apivault-tennis-abstract-bulk-scraper#readme"

[tool.setuptools.packages.find]
include = ["apivault_tennis_abstract_bulk_scraper*"]
