[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apivault-website-tech-detector"
version = "0.1.0"
description = "Python client for Tech Stack Detector on Apify. Run, resume and download results with diagnostics."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name="ApiVault Labs"}]
keywords = ["apify", "python-sdk", "website", "tech", "detector"]

[project.urls]
Homepage = "https://apify.com/apivault_labs/website-tech-detector"
Source = "https://github.com/apivault-labs/apivault-labs/tree/main/python-clients/apivault-website-tech-detector"
Documentation = "https://github.com/apivault-labs/apivault-labs/tree/main/python-clients/apivault-website-tech-detector#readme"

[tool.setuptools.packages.find]
include = ["apivault_website_tech_detector*"]
