[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apivault-ad-library-scraper-facebook-tiktok-google-ads"
version = "0.1.0"
description = "Python client for Ad Library Scraper on Apify. Run, resume and download results with diagnostics."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name="ApiVault Labs"}]
keywords = ["apify", "python-sdk", "ad", "library", "scraper", "facebook", "tiktok", "google", "ads"]

[project.urls]
Homepage = "https://apify.com/apivault_labs/ad-library-scraper-facebook-tiktok-google-ads"
Source = "https://github.com/apivault-labs/apivault-labs/tree/main/python-clients/apivault-ad-library-scraper-facebook-tiktok-google-ads"
Documentation = "https://github.com/apivault-labs/apivault-labs/tree/main/python-clients/apivault-ad-library-scraper-facebook-tiktok-google-ads#readme"

[tool.setuptools.packages.find]
include = ["apivault_ad_library_scraper_facebook_tiktok_google_ads*"]
