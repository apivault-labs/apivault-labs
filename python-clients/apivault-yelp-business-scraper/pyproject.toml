[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apivault-yelp-business-scraper"
version = "0.1.0"
description = "Python client for Yelp Business Scraper on Apify. Run, resume and download results with diagnostics."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name="ApiVault Labs"}]
keywords = ["apify", "python-sdk", "yelp", "business", "scraper"]

[project.urls]
Homepage = "https://apify.com/apivault_labs/yelp-business-scraper"
Source = "https://github.com/apivault-labs/apivault-labs/tree/main/python-clients/apivault-yelp-business-scraper"
Documentation = "https://github.com/apivault-labs/apivault-labs/tree/main/python-clients/apivault-yelp-business-scraper#readme"

[tool.setuptools.packages.find]
include = ["apivault_yelp_business_scraper*"]
