[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apivault-email-deliverability-checker"
version = "0.1.0"
description = "Python client for Bulk Email Verifier & Finder on Apify. Run, resume and download results with diagnostics."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name="ApiVault Labs"}]
keywords = ["apify", "python-sdk", "email", "deliverability", "checker"]

[project.urls]
Homepage = "https://apify.com/apivault_labs/email-deliverability-checker"
Source = "https://github.com/apivault-labs/apivault-labs/tree/main/python-clients/apivault-email-deliverability-checker"
Documentation = "https://github.com/apivault-labs/apivault-labs/tree/main/python-clients/apivault-email-deliverability-checker#readme"

[tool.setuptools.packages.find]
include = ["apivault_email_deliverability_checker*"]
