[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apivault-google-maps-scraper-emails-contact-details-leads"
version = "0.1.0"
description = "Python client for Google Maps Scraper on Apify. Run, resume and download results with diagnostics."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name="ApiVault Labs"}]
keywords = ["apify", "python-sdk", "google", "maps", "scraper", "emails", "contact", "details", "leads"]

[project.urls]
Homepage = "https://apify.com/apivault_labs/google-maps-scraper-emails-contact-details-leads"
Source = "https://github.com/apivault-labs/apivault-labs/tree/main/python-clients/apivault-google-maps-scraper-emails-contact-details-leads"
Documentation = "https://github.com/apivault-labs/apivault-labs/tree/main/python-clients/apivault-google-maps-scraper-emails-contact-details-leads#readme"

[tool.setuptools.packages.find]
include = ["apivault_google_maps_scraper_emails_contact_details_leads*"]
