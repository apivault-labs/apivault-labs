[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apivault-facebook-reviews-scraper"
version = "0.1.0"
description = "Python client for Facebook Reviews Scraper on Apify. Run, resume and download results with diagnostics."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name="ApiVault Labs"}]
keywords = ["apify", "python-sdk", "facebook", "reviews", "scraper"]

[project.urls]
Homepage = "https://apify.com/apivault_labs/facebook-reviews-scraper"
Source = "https://github.com/apivault-labs/apivault-labs/tree/main/python-clients/apivault-facebook-reviews-scraper"
Documentation = "https://github.com/apivault-labs/apivault-labs/tree/main/python-clients/apivault-facebook-reviews-scraper#readme"

[tool.setuptools.packages.find]
include = ["apivault_facebook_reviews_scraper*"]
