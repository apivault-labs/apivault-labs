[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apivault-business-locations-analyzer"
version = "0.1.0"
description = "Python client for Business Locations Analyzer on Apify. Run, resume and download results with diagnostics."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name="ApiVault Labs"}]
keywords = ["apify", "python-sdk", "business", "locations", "analyzer"]

[project.urls]
Homepage = "https://apify.com/apivault_labs/business-locations-analyzer"
Source = "https://github.com/apivault-labs/apivault-labs/tree/main/python-clients/apivault-business-locations-analyzer"
Documentation = "https://github.com/apivault-labs/apivault-labs/tree/main/python-clients/apivault-business-locations-analyzer#readme"

[tool.setuptools.packages.find]
include = ["apivault_business_locations_analyzer*"]
