[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apivault-ai-background-changer"
version = "0.1.0"
description = "Python client for AI Background Changer on Apify. Run, resume and download results with diagnostics."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name="ApiVault Labs"}]
keywords = ["apify", "python-sdk", "ai", "background", "changer"]

[project.urls]
Homepage = "https://apify.com/apivault_labs/aI-background-changer"
Source = "https://github.com/apivault-labs/apivault-labs/tree/main/python-clients/apivault-ai-background-changer"
Documentation = "https://github.com/apivault-labs/apivault-labs/tree/main/python-clients/apivault-ai-background-changer#readme"

[tool.setuptools.packages.find]
include = ["apivault_ai_background_changer*"]
