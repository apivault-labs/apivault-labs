[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apivault-universal-rss-scraper"
version = "0.1.0"
description = "Python client for RSS Feed Scraper on Apify. Run, resume and download results with diagnostics."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name="ApiVault Labs"}]
keywords = ["apify", "python-sdk", "universal", "rss", "scraper"]

[project.urls]
Homepage = "https://apify.com/apivault_labs/universal-rss-scraper"
Source = "https://github.com/apivault-labs/apivault-labs/tree/main/python-clients/apivault-universal-rss-scraper"
Documentation = "https://github.com/apivault-labs/apivault-labs/tree/main/python-clients/apivault-universal-rss-scraper#readme"

[tool.setuptools.packages.find]
include = ["apivault_universal_rss_scraper*"]
