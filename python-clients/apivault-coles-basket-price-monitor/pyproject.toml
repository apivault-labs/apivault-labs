[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apivault-coles-basket-price-monitor"
version = "0.1.0"
description = "Python client for Coles Scraper on Apify. Run, resume and download results with diagnostics."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name="ApiVault Labs"}]
keywords = ["apify", "python-sdk", "coles", "basket", "price", "monitor"]

[project.urls]
Homepage = "https://apify.com/apivault_labs/coles-basket-price-monitor"
Source = "https://github.com/apivault-labs/apivault-labs/tree/main/python-clients/apivault-coles-basket-price-monitor"
Documentation = "https://github.com/apivault-labs/apivault-labs/tree/main/python-clients/apivault-coles-basket-price-monitor#readme"

[tool.setuptools.packages.find]
include = ["apivault_coles_basket_price_monitor*"]
