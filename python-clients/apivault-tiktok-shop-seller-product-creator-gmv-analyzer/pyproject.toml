[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apivault-tiktok-shop-seller-product-creator-gmv-analyzer"
version = "0.1.0"
description = "Python client for TikTok Shop GMV Analyzer on Apify. Run, resume and download results with diagnostics."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name="ApiVault Labs"}]
keywords = ["apify", "python-sdk", "tiktok", "shop", "seller", "product", "creator", "gmv", "analyzer"]

[project.urls]
Homepage = "https://apify.com/apivault_labs/tiktok-shop-seller-product-creator-gmv-analyzer"
Source = "https://github.com/apivault-labs/apivault-labs/tree/main/python-clients/apivault-tiktok-shop-seller-product-creator-gmv-analyzer"
Documentation = "https://github.com/apivault-labs/apivault-labs/tree/main/python-clients/apivault-tiktok-shop-seller-product-creator-gmv-analyzer#readme"

[tool.setuptools.packages.find]
include = ["apivault_tiktok_shop_seller_product_creator_gmv_analyzer*"]
