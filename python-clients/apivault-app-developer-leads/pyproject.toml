[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apivault-app-developer-leads"
version = "0.1.0"
description = "Python client for App Developer Leads on Apify. Run, resume and download results with diagnostics."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name="ApiVault Labs"}]
keywords = ["apify", "python-sdk", "app", "developer", "leads"]

[project.urls]
Homepage = "https://apify.com/apivault_labs/app-developer-leads"
Source = "https://github.com/apivault-labs/apivault-labs/tree/main/python-clients/apivault-app-developer-leads"
Documentation = "https://github.com/apivault-labs/apivault-labs/tree/main/python-clients/apivault-app-developer-leads#readme"

[tool.setuptools.packages.find]
include = ["apivault_app_developer_leads*"]
