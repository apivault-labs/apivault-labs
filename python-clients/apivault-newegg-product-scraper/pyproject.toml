[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apivault-newegg-product-scraper"
version = "0.1.0"
description = "Python client for Newegg Product Scraper on Apify. Run, resume and download results with diagnostics."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name="ApiVault Labs"}]
keywords = ["apify", "python-sdk", "newegg", "product", "scraper"]

[project.urls]
Homepage = "https://apify.com/apivault_labs/newegg-product-scraper"
Source = "https://github.com/apivault-labs/apivault-labs/tree/main/python-clients/apivault-newegg-product-scraper"
Documentation = "https://github.com/apivault-labs/apivault-labs/tree/main/python-clients/apivault-newegg-product-scraper#readme"

[tool.setuptools.packages.find]
include = ["apivault_newegg_product_scraper*"]
