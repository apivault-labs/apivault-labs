[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apivault-local-business-lead-finder-pro"
version = "0.1.0"
description = "Python client for Local Lead Finder Pro on Apify. Run, resume and download results with diagnostics."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name="ApiVault Labs"}]
keywords = ["apify", "python-sdk", "local", "business", "lead", "finder", "pro"]

[project.urls]
Homepage = "https://apify.com/apivault_labs/local-business-lead-finder-pro"
Source = "https://github.com/apivault-labs/apivault-labs/tree/main/python-clients/apivault-local-business-lead-finder-pro"
Documentation = "https://github.com/apivault-labs/apivault-labs/tree/main/python-clients/apivault-local-business-lead-finder-pro#readme"

[tool.setuptools.packages.find]
include = ["apivault_local_business_lead_finder_pro*"]
