[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apivault-ai-photo-upscaler"
version = "0.1.0"
description = "Python client for AI Image Upscaler on Apify. Run, resume and download results with diagnostics."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name="ApiVault Labs"}]
keywords = ["apify", "python-sdk", "ai", "photo", "upscaler"]

[project.urls]
Homepage = "https://apify.com/apivault_labs/ai-photo-upscaler"
Source = "https://github.com/apivault-labs/apivault-labs/tree/main/python-clients/apivault-ai-photo-upscaler"
Documentation = "https://github.com/apivault-labs/apivault-labs/tree/main/python-clients/apivault-ai-photo-upscaler#readme"

[tool.setuptools.packages.find]
include = ["apivault_ai_photo_upscaler*"]
