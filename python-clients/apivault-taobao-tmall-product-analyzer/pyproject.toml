[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apivault-taobao-tmall-product-analyzer"
version = "0.1.0"
description = "Python client for Taobao Product Analyzer on Apify. Run, resume and download results with diagnostics."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name="ApiVault Labs"}]
keywords = ["apify", "python-sdk", "taobao", "tmall", "product", "analyzer"]

[project.urls]
Homepage = "https://apify.com/apivault_labs/taobao-tmall-product-analyzer"
Source = "https://github.com/apivault-labs/apivault-labs/tree/main/python-clients/apivault-taobao-tmall-product-analyzer"
Documentation = "https://github.com/apivault-labs/apivault-labs/tree/main/python-clients/apivault-taobao-tmall-product-analyzer#readme"

[tool.setuptools.packages.find]
include = ["apivault_taobao_tmall_product_analyzer*"]
