[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apivault-adobe-stock-scraper"
version = "0.1.0"
description = "Python client for Adobe Stock Scraper on Apify. Run, resume and download results with diagnostics."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name="ApiVault Labs"}]
keywords = ["apify", "python-sdk", "adobe", "stock", "scraper"]

[project.urls]
Homepage = "https://apify.com/apivault_labs/adobe-stock-scraper"
Source = "https://github.com/apivault-labs/apivault-labs/tree/main/python-clients/apivault-adobe-stock-scraper"
Documentation = "https://github.com/apivault-labs/apivault-labs/tree/main/python-clients/apivault-adobe-stock-scraper#readme"

[tool.setuptools.packages.find]
include = ["apivault_adobe_stock_scraper*"]
