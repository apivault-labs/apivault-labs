[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apivault-1688-image-search"
version = "0.1.0"
description = "Python client for 1688 Reverse Image Search on Apify. Run, resume and download results with diagnostics."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name="ApiVault Labs"}]
keywords = ["apify", "python-sdk", "1688", "image", "search"]

[project.urls]
Homepage = "https://apify.com/apivault_labs/1688-image-search"
Source = "https://github.com/apivault-labs/apivault-labs/tree/main/python-clients/apivault-1688-image-search"
Documentation = "https://github.com/apivault-labs/apivault-labs/tree/main/python-clients/apivault-1688-image-search#readme"

[tool.setuptools.packages.find]
include = ["apivault_1688_image_search*"]
