name: Validate practical workflow kit
on:
  push:
    paths: ['guides/three-workflows/**', '.github/workflows/three-workflows.yml']
  pull_request:
    paths: ['guides/three-workflows/**', '.github/workflows/three-workflows.yml']
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.22.2'
      - run: node guides/three-workflows/test.cjs
