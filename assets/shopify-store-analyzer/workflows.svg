<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360"><rect width="1200" height="360" rx="24" fill="#edf7f1"/><g font-family="Arial,sans-serif" fill="#163c2c"><text x="48" y="60" font-size="30" font-weight="bold">From public stores to useful research</text><g font-size="22" font-weight="bold"><text x="48" y="132">1. Choose a starting point</text><text x="442" y="132">2. Select your output</text><text x="833" y="132">3. Inspect and export</text></g><g font-size="20"><text x="48" y="182">Store URLs</text><text x="48" y="216">Niche keywords</text><text x="48" y="250">A similar-store seed</text><text x="442" y="182">Compact or leads</text><text x="442" y="216">Monitoring or full</text><text x="442" y="250">Public signals + coverage</text><text x="833" y="182">Dataset + SUMMARY</text><text x="833" y="216">JSON, CSV, Excel</text><text x="833" y="250">API, MCP, n8n, Python</text></g><text x="48" y="318" font-size="18">Bounded discovery. Contacts when publicly found. Estimates and missing data are labeled.</text></g></svg>