[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apivault-google-news-search"
version = "0.1.0"
description = "Python client for Google News Search on Apify. Run, resume and download results with diagnostics."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name="ApiVault Labs"}]
keywords = ["apify", "python-sdk", "google", "news", "search"]

[project.urls]
Homepage = "https://apify.com/apivault_labs/google-news-search"
Source = "https://github.com/apivault-labs/apivault-labs/tree/main/packages/apivault-google-news-search"
Documentation = "https://github.com/apivault-labs/apivault-labs/tree/main/packages/apivault-google-news-search#readme"

[tool.setuptools.packages.find]
include = ["apivault_google_news_search*"]
