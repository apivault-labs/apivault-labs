[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apivault-naver-smartstore-source-probe"
version = "0.1.0"
description = "Python client for Naver Brand Store Scraper on Apify. Run, resume and download results with diagnostics."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name="ApiVault Labs"}]
keywords = ["apify", "python-sdk", "naver", "smartstore", "source", "probe"]

[project.urls]
Homepage = "https://apify.com/apivault_labs/naver-smartstore-source-probe"
Source = "https://github.com/apivault-labs/apivault-labs/tree/main/packages/apivault-naver-smartstore-source-probe"
Documentation = "https://github.com/apivault-labs/apivault-labs/tree/main/packages/apivault-naver-smartstore-source-probe#readme"

[tool.setuptools.packages.find]
include = ["apivault_naver_smartstore_source_probe*"]
