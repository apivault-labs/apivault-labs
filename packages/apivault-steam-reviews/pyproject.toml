[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apivault-steam-reviews"
version = "0.1.0"
description = "Python client for Steam Reviews on Apify. Run, resume and download results with diagnostics."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name="ApiVault Labs"}]
keywords = ["apify", "python-sdk", "steam", "game-reviews", "scraper"]

[project.urls]
Homepage = "https://apify.com/apivault_labs/steam-reviews-source-probe"
Source = "https://github.com/apivault-labs/apivault-labs/tree/main/packages/apivault-steam-reviews"
Documentation = "https://github.com/apivault-labs/apivault-labs/tree/main/packages/apivault-steam-reviews#readme"

[tool.setuptools.packages.find]
include = ["apivault_steam_reviews*"]
