[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apivault-telegram-public-channels-scraper"
version = "0.1.0"
description = "Python client for Telegram Channel Scraper on Apify. Run, resume and download results with diagnostics."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name="ApiVault Labs"}]
keywords = ["apify", "python-sdk", "telegram", "public", "channels", "scraper"]

[project.urls]
Homepage = "https://apify.com/apivault_labs/telegram-public-channels-scraper"
Source = "https://github.com/apivault-labs/apivault-labs/tree/main/packages/apivault-telegram-public-channels-scraper"
Documentation = "https://github.com/apivault-labs/apivault-labs/tree/main/packages/apivault-telegram-public-channels-scraper#readme"

[tool.setuptools.packages.find]
include = ["apivault_telegram_public_channels_scraper*"]
