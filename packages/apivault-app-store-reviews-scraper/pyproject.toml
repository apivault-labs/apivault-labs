[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apivault-app-store-reviews-scraper"
version = "0.1.0"
description = "Python client for App Store Reviews Scraper on Apify. Run, resume and download results with diagnostics."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name="ApiVault Labs"}]
keywords = ["apify", "python-sdk", "app", "store", "reviews", "scraper"]

[project.urls]
Homepage = "https://apify.com/apivault_labs/app-store-reviews-scraper"
Source = "https://github.com/apivault-labs/apivault-labs/tree/main/packages/apivault-app-store-reviews-scraper"
Documentation = "https://github.com/apivault-labs/apivault-labs/tree/main/packages/apivault-app-store-reviews-scraper#readme"

[tool.setuptools.packages.find]
include = ["apivault_app_store_reviews_scraper*"]
