[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apivault-substack-archive-scraper"
version = "0.1.0"
description = "Python client for Substack Archive Scraper on Apify. Run, resume and download results with diagnostics."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name="ApiVault Labs"}]
keywords = ["apify", "python-sdk", "substack", "archive", "scraper"]

[project.urls]
Homepage = "https://apify.com/apivault_labs/substack-archive-scraper"
Source = "https://github.com/apivault-labs/apivault-labs/tree/main/packages/apivault-substack-archive-scraper"
Documentation = "https://github.com/apivault-labs/apivault-labs/tree/main/packages/apivault-substack-archive-scraper#readme"

[tool.setuptools.packages.find]
include = ["apivault_substack_archive_scraper*"]
